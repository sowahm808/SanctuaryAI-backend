services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      {
        test: ["CMD", "redis-cli", "ping"],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
  api:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on: { redis: { condition: service_healthy } }
