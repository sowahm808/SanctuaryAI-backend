services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: sanctuary, POSTGRES_PASSWORD: sanctuary, POSTGRES_DB: sanctuary}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U sanctuary"], interval: 5s, timeout: 3s, retries: 10}
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
volumes: {postgres-data: {}}
